      // ==================== PROFILE & SPREADSHEET TAB ====================
      function ProfileTab({
        profile,
        setProfile,
        scriptUrl,
        setScriptUrl,
        showToast,
        syncToSpreadsheet,
        loadFromSpreadsheet,
        testConnection,
        isSyncing,
      }) {
        const [tempProfile, setTempProfile] = useState(profile);
        const [urlInput, setUrlInput] = useState(scriptUrl);
        const [keyInput, setKeyInput] = useState(getApiKey());

        const handleLogoUpload = (e) => {
          const file = e.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onloadend = () => {
              setTempProfile({ ...tempProfile, logo: reader.result });
            };
            reader.readAsDataURL(file);
          }
        };

        const handleSaveProfile = (e) => {
          e.preventDefault();
          setProfile(tempProfile);
          setScriptUrl(urlInput.trim());
          localStorage.setItem("umkm_api_key", keyInput.trim());
          showToast("Profil bisnis & integrasi berhasil disimpan!");
        };

        return (
          <div className="max-w-2xl mx-auto space-y-8">
            <div className="bg-white p-6 sm:p-8 rounded-3xl border border-slate-200 shadow-sm">
              <h2 className="text-xl font-extrabold text-brand-800 mb-6">
                ⚙️ Edit Profil Bisnis UMKM
              </h2>

              <form onSubmit={handleSaveProfile} className="space-y-6">
                <div>
                  <label className="block text-xs font-bold text-slate-700 uppercase mb-2">
                    Foto / Logo Bisnis
                  </label>
                  <div className="flex items-center gap-4">
                    <img
                      src={tempProfile.logo}
                      className="w-16 h-16 rounded-2xl object-cover ring-2 ring-brand-800"
                    />
                    <input
                      type="file"
                      accept="image/*"
                      onChange={handleLogoUpload}
                      className="text-xs text-slate-500 file:py-2 file:px-4 file:rounded-xl file:border-0 file:bg-brand-800 file:text-white cursor-pointer"
                    />
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-700 uppercase mb-1">
                    Nama Usaha / Kedai
                  </label>
                  <input
                    type="text"
                    required
                    value={tempProfile.name}
                    onChange={(e) =>
                      setTempProfile({ ...tempProfile, name: e.target.value })
                    }
                    className="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand-800"
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-700 uppercase mb-1">
                    Tagline / Deskripsi Singkat
                  </label>
                  <input
                    type="text"
                    value={tempProfile.tagline}
                    onChange={(e) =>
                      setTempProfile({
                        ...tempProfile,
                        tagline: e.target.value,
                      })
                    }
                    className="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand-800"
                  />
                </div>

                <hr className="border-slate-100" />

                <div>
                  <h3 className="text-base font-bold text-brand-800 mb-2">
                    📊 Integrasi Google Sheets
                  </h3>
                  <p className="text-xs text-slate-500 mb-3">
                    Masukkan URL Web App dari Apps Script (`Code.gs`) untuk
                    sinkronisasi otomatis ke Google Spreadsheet kamu.
                  </p>
                  <input
                    type="url"
                    placeholder="https://script.google.com/macros/s/..."
                    value={urlInput}
                    onChange={(e) => setUrlInput(e.target.value)}
                    className="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-xs focus:outline-none focus:ring-2 focus:ring-brand-800"
                  />
                  <input
                    type="password"
                    placeholder="API key (opsional, samakan dengan Script Properties API_KEY)"
                    value={keyInput}
                    onChange={(e) => setKeyInput(e.target.value)}
                    className="w-full mt-2 bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-xs focus:outline-none focus:ring-2 focus:ring-brand-800"
                  />
                </div>

                <div className="flex items-center justify-between pt-4">
                  <div className="flex flex-wrap gap-2">
                    <button
                    type="button"
                    onClick={syncToSpreadsheet}
                    disabled={isSyncing}
                    className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-5 py-2.5 rounded-2xl text-xs transition-all"
                  >
                    {isSyncing ? "⏳ Syncing..." : "Test Sync Sekarang"}
                  </button>
                    <button
                      type="button"
                      onClick={loadFromSpreadsheet}
                      disabled={isSyncing}
                      className="bg-brand-50 hover:bg-brand-100 text-brand-800 border border-brand-200 font-bold px-5 py-2.5 rounded-2xl text-xs transition-all"
                    >
                      ⬇️ Tarik dari Sheets
                    </button>
                    <button
                      type="button"
                      onClick={testConnection}
                      disabled={isSyncing}
                      className="bg-white hover:bg-slate-100 text-slate-700 border border-slate-200 font-bold px-5 py-2.5 rounded-2xl text-xs transition-all"
                    >
                      🔌 Tes Koneksi
                    </button>
                  </div>

                  <button
                    type="submit"
                    className="bg-brand-800 hover:bg-brand-900 text-white font-bold px-6 py-3 rounded-2xl text-sm shadow-md transition-all"
                  >
                    Simpan Perubahan
                  </button>
                </div>
              </form>
            </div>
          </div>
        );
      }

      // ==================== HPP TAB ====================
      const inCls =
        "w-full min-w-[70px] bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-brand-800";
      const nm = (v) => parseFloat(v) || 0;
      const rpf = (n) =>
        "Rp " + Math.round(isFinite(n) ? n : 0).toLocaleString("id-ID");
      const fmtUnit = (n) =>
        n < 100
          ? n.toFixed(2).replace(".", ",")
          : Math.round(n).toLocaleString("id-ID");
      const up500 = (n) => Math.ceil(n / 500) * 500;
      const Num = ({ v, on }) => (
        <input
          type="number"
          step="any"
          min="0"
          value={v}
          onChange={(e) => on(e.target.value)}
          className={inCls + " text-right"}
        />
      );
      const Txt = ({ v, on }) => (
        <input
          type="text"
          value={v}
          onChange={(e) => on(e.target.value)}
          className={inCls}
        />
      );

      function HppTab({ menus, setMenus, hpp, setHpp, showToast }) {
        const [sub, setSub] = useState("harga");
        const [sim, setSim] = useState({ g: "10", per: {}, mode: {} });
        const upd = (fn) => {
          const c = JSON.parse(JSON.stringify(hpp));
          fn(c);
          setHpp(c);
        };
        const uid = () => Math.random().toString(36).slice(2, 8);
        const bById = (id) => hpp.bahan.find((x) => x.id === id);
        const rById = (id) => hpp.resep.find((x) => x.id === id);
        const unitCost = (b) => {
          const d = (nm(b.isi) * nm(b.yield)) / 100;
          return d ? (nm(b.harga) + nm(b.ongkir)) / d : 0;
        };
        const refUnit = (ref, d = 0) => {
          const [t, id] = ref.split(":");
          if (t === "b") {
            const b = bById(id);
            return b ? unitCost(b) : 0;
          }
          const r = rById(id);
          return r && d < 5 ? recipeCost(r, d + 1) / (nm(r.hasil) || 1) : 0;
        };
        const recipeCost = (r, d = 0) =>
          r.items.reduce((s, i) => s + nm(i.qty) * refUnit(i.ref, d), 0);
        const perPorsi = (r) => recipeCost(r) / (nm(r.hasil) || 1);
        const susut = (a) => (nm(a.harga) - nm(a.sisa)) / (nm(a.umur) || 1);
        const totalOps =
          hpp.biaya.reduce((s, x) => s + nm(x.v), 0) +
          hpp.alat.reduce((s, a) => s + susut(a), 0);
        const overhead = totalOps / (nm(hpp.vol) || 1);
        const unitOf = (ref) => {
          const [t, id] = ref.split(":");
          if (t === "b") {
            const b = bById(id);
            return b ? b.satuan : "";
          }
          const r = rById(id);
          return r ? r.unit : "";
        };
        const menuOf = (r) =>
          menus.find((m) => String(m.id) === String(r.menuId));

        const card =
          "bg-white p-5 rounded-3xl border border-slate-200 shadow-sm";
        const th =
          "text-[10px] font-bold uppercase text-slate-500 px-2 py-2 text-left whitespace-nowrap";
        const td = "px-2 py-1.5 whitespace-nowrap";
        const delBtn = (fn) => (
          <button onClick={fn} className="text-rose-600 font-bold text-xs px-2">
            ✕
          </button>
        );
        const addBtn = (label, fn) => (
          <button
            onClick={fn}
            className="bg-brand-50 text-brand-800 border border-brand-200 font-bold text-xs px-3 py-2 rounded-xl hover:bg-brand-100"
          >
            {label}
          </button>
        );
        const ask = (fn) => {
          if (confirm("Hapus baris ini?")) fn();
        };

        const menuRecipes = hpp.resep.filter((r) => !r.batch);
        const rows = menuRecipes
          .map((r) => {
            const m = menuOf(r);
            const hb = perPorsi(r);
            const hp = hb + overhead;
            const saran = up500(hb / (nm(hpp.fc) / 100 || 1));
            const jual = m ? nm(m.price) : nm(r.harga) || saran;
            const net = jual * (1 - nm(hpp.qris) / 100) - hp;
            const netPl = jual * (1 - nm(hpp.fee) / 100) - hp;
            const fcAct = jual ? (hb / jual) * 100 : 0;
            return {
              r,
              m,
              hb,
              hp,
              saran,
              jual,
              net,
              netPl,
              fcAct,
              hargaPl: up500(jual / (1 - nm(hpp.fee) / 100 || 1)),
            };
          })
          .sort((a, b) => b.net - a.net);

        const setJual = (x, v) => {
          if (x.m)
            setMenus((ms) =>
              ms.map((m) => (m.id === x.m.id ? { ...m, price: nm(v) } : m)),
            );
          else
            upd((c) => {
              c.resep.find((r) => r.id === x.r.id).harga = v;
            });
        };
        const applyHpp = (x) => {
          if (!x.m) return;
          setMenus((ms) =>
            ms.map((m) =>
              m.id === x.m.id ? { ...m, hpp: Math.round(x.hb) } : m,
            ),
          );
          showToast(`HPP "${x.m.name}" diterapkan: ${rpf(x.hb)}`);
        };
        const applyAll = () => {
          const map = {};
          rows.forEach((x) => {
            if (x.m) map[x.m.id] = Math.round(x.hb);
          });
          setMenus((ms) =>
            ms.map((m) => (map[m.id] != null ? { ...m, hpp: map[m.id] } : m)),
          );
          showToast("HPP bahan semua menu tertaut sudah diterapkan ke tab Menu!");
        };

        const simHarga = (b) => {
          const v = sim.per[b.id];
          const has = v !== undefined && v !== "";
          if (has && (sim.mode[b.id] || "%") === "Rp") return Math.max(0, nm(b.harga) + nm(v));
          return nm(b.harga) * (1 + (has ? nm(v) : nm(sim.g)) / 100);
        };
        const simUnit = (b) => {
          const d = (nm(b.isi) * nm(b.yield)) / 100;
          return d ? (simHarga(b) + nm(b.ongkir)) / d : 0;
        };
        const refUnitS = (ref, d = 0) => {
          const [t, id] = ref.split(":");
          if (t === "b") {
            const b = bById(id);
            return b ? simUnit(b) : 0;
          }
          const r = rById(id);
          return r && d < 5 ? recipeCostS(r, d + 1) / (nm(r.hasil) || 1) : 0;
        };
        const recipeCostS = (r, d = 0) =>
          r.items.reduce((s, i) => s + nm(i.qty) * refUnitS(i.ref, d), 0);

        const exportCsv = () => {
          const head = ["Menu", "HPP bahan", "Overhead", "HPP penuh", "Harga jual", "Food cost %", "Laba bersih offline", "Harga online", "Laba online"];
          const lines = [head].concat(
            rows.map((x) => [
              x.m ? x.m.name : x.r.nama,
              Math.round(x.hb),
              Math.round(overhead),
              Math.round(x.hp),
              Math.round(x.jual),
              x.fcAct.toFixed(1),
              Math.round(x.net),
              x.hargaPl,
              Math.round(x.netPl),
            ]),
          );
          const csv = lines
            .map((l) => l.map((v) => '"' + String(v).replace(/"/g, '""') + '"').join(","))
            .join("\n");
          const a = document.createElement("a");
          a.href = URL.createObjectURL(new Blob(["\ufeff" + csv], { type: "text/csv" }));
          a.download = "hpp-menu.csv";
          a.click();
        };

        const over = rows.filter((x) => x.fcAct > nm(hpp.fc));
        const rugi = rows.filter((x) => x.net < 0);
        const banner =
          over.length || rugi.length ? (
            <div className="bg-amber-50 border border-amber-200 text-amber-800 rounded-2xl p-4 text-xs font-semibold space-y-1">
              {over.length > 0 && (
                <p>
                  ⚠️ {over.length} menu melewati target food cost:{" "}
                  {over.map((x) => (x.m ? x.m.name : x.r.nama)).join(", ")}
                </p>
              )}
              {rugi.length > 0 && (
                <p>
                  🔻 {rugi.length} menu rugi setelah overhead:{" "}
                  {rugi.map((x) => (x.m ? x.m.name : x.r.nama)).join(", ")}
                </p>
              )}
            </div>
          ) : (
            <div className="bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-2xl p-4 text-xs font-semibold">
              ✅ Semua menu sesuai target food cost dan masih untung.
            </div>
          );

        const viewHarga = (
          <div className="space-y-6">
            {banner}
            <div className={card}>
              <h3 className="font-extrabold text-brand-800 mb-3">
                🎯 Pengaturan Target
              </h3>
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                {[
                  ["Target food cost %", "fc"],
                  ["Fee QRIS/EDC %", "qris"],
                  ["Komisi platform online %", "fee"],
                ].map(([l, k]) => (
                  <div key={k}>
                    <label className="block text-[10px] font-bold uppercase text-slate-600 mb-1">
                      {l}
                    </label>
                    <Num
                      v={hpp[k]}
                      on={(v) =>
                        upd((c) => {
                          c[k] = v;
                        })
                      }
                    />
                  </div>
                ))}
              </div>
              <p className="text-xs text-slate-500 mt-2">
                Overhead per porsi saat ini <b>{rpf(overhead)}</b> (atur di
                sub-tab Operasional).
              </p>
            </div>
            <div className={card}>
              <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
                <h3 className="font-extrabold text-brand-800">
                  💰 Harga & Laba per Menu
                </h3>
                <div className="flex gap-2">{addBtn("⬇️ Terapkan HPP bahan ke semua menu", applyAll)}{addBtn("📄 Ekspor CSV", exportCsv)}</div>
              </div>
              <div className="overflow-x-auto">
                <table className="w-full text-xs min-w-[900px]">
                  <thead>
                    <tr>
                      {[
                        "Menu",
                        "HPP bahan",
                        "HPP penuh",
                        "Saran harga",
                        "Harga jual",
                        "Food cost",
                        "Laba bersih offline",
                        "Harga online",
                        "Laba online (harga sama)",
                        "",
                      ].map((h) => (
                        <th key={h} className={th}>
                          {h}
                        </th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {rows.map((x) => (
                      <tr key={x.r.id} className="border-t border-slate-100">
                        <td className={td + " font-bold"}>
                          {x.m ? x.m.name : x.r.nama}
                          {!x.m && (
                            <span className="block text-[10px] font-normal text-amber-600">
                              belum tertaut ke menu
                            </span>
                          )}
                        </td>
                        <td className={td}>{rpf(x.hb)}</td>
                        <td className={td}>{rpf(x.hp)}</td>
                        <td className={td}>{rpf(x.saran)}</td>
                        <td className={td}>
                          <Num v={x.jual} on={(v) => setJual(x, v)} />
                        </td>
                        <td className={td}>
                          <span
                            className={`px-2 py-0.5 rounded-full font-bold ${x.fcAct <= nm(hpp.fc) ? "bg-emerald-100 text-emerald-700" : "bg-rose-100 text-rose-700"}`}
                          >
                            {x.fcAct.toFixed(1).replace(".", ",")}%
                          </span>
                        </td>
                        <td
                          className={`${td} font-bold ${x.net >= 0 ? "text-emerald-600" : "text-rose-600"}`}
                        >
                          {rpf(x.net)}
                        </td>
                        <td className={td}>{rpf(x.hargaPl)}</td>
                        <td
                          className={`${td} ${x.netPl >= 0 ? "text-emerald-600" : "text-rose-600"}`}
                        >
                          {rpf(x.netPl)}
                        </td>
                        <td className={td}>
                          {x.m && (
                            <button
                              onClick={() => applyHpp(x)}
                              className="text-brand-800 font-bold underline"
                            >
                              Terapkan HPP
                            </button>
                          )}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              <p className="text-[11px] text-slate-500 mt-3">
                Harga jual menu tertaut = harga di tab Menu (diubah di sini ikut
                berubah). "Terapkan HPP" mengisi kolom HPP di tab Menu dengan HPP
                bahan, yang dipakai Dashboard untuk laba kotor. Laba bersih =
                harga − fee pembayaran − HPP penuh (bahan + overhead). Pajak
                belum dihitung.
              </p>
            </div>
          </div>
        );

        const bf = (i, f) => (
          <td className={td}>
            <Num
              v={hpp.bahan[i][f]}
              on={(v) =>
                upd((c) => {
                  const b = c.bahan[i];
                  if (f === "harga") {
                    const d = new Date().toISOString().slice(0, 10);
                    b.hist = b.hist || [{ d: "awal", h: b.harga }];
                    const last = b.hist[b.hist.length - 1];
                    if (last.d === d) last.h = v;
                    else b.hist.push({ d, h: v });
                  }
                  b[f] = v;
                })
              }
            />
          </td>
        );
        const trend = (b) => {
          const h = b.hist || [];
          if (h.length < 2) return <span className="text-slate-400">-</span>;
          const a = nm(h[h.length - 2].h), z = nm(h[h.length - 1].h);
          const ch = a ? ((z - a) / a) * 100 : 0;
          const tip = h.map((x) => x.d + ": " + rpf(nm(x.h))).join("\n");
          return (
            <span title={tip} className={`font-bold cursor-help ${ch > 0 ? "text-rose-600" : ch < 0 ? "text-emerald-600" : "text-slate-500"}`}>
              {ch > 0 ? "▲" : ch < 0 ? "▼" : "•"} {Math.abs(ch).toFixed(1).replace(".", ",")}%
            </span>
          );
        };
        const viewBahan = (
          <div className={card}>
            <h3 className="font-extrabold text-brand-800 mb-3">
              🥛 Bahan Baku & Kemasan
            </h3>
            <div className="overflow-x-auto">
              <table className="w-full text-xs min-w-[780px]">
                <thead>
                  <tr>
                    {[
                      "Nama",
                      "Satuan",
                      "Harga beli",
                      "Ongkir",
                      "Isi bersih",
                      "Yield %",
                      "Biaya / satuan",
                      "Perubahan harga",
                      "",
                    ].map((h) => (
                      <th key={h} className={th}>
                        {h}
                      </th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {hpp.bahan.map((b, i) => (
                    <tr key={b.id} className="border-t border-slate-100">
                      <td className={td}>
                        <Txt
                          v={b.nama}
                          on={(v) =>
                            upd((c) => {
                              c.bahan[i].nama = v;
                            })
                          }
                        />
                      </td>
                      <td className={td}>
                        <select
                          value={b.satuan}
                          onChange={(e) =>
                            upd((c) => {
                              c.bahan[i].satuan = e.target.value;
                            })
                          }
                          className={inCls}
                        >
                          {["g", "ml", "pcs"].map((u) => (
                            <option key={u}>{u}</option>
                          ))}
                        </select>
                      </td>
                      {bf(i, "harga")}
                      {bf(i, "ongkir")}
                      {bf(i, "isi")}
                      {bf(i, "yield")}
                      <td className={td + " font-bold text-brand-800"}>
                        Rp {fmtUnit(unitCost(b))}/{b.satuan}
                      </td>
                      <td className={td}>{trend(b)}</td>
                      <td className={td}>
                        {delBtn(() =>
                          ask(() =>
                            upd((c) => {
                              c.bahan.splice(i, 1);
                            }),
                          ),
                        )}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <div className="mt-3">
              {addBtn("+ Tambah bahan", () =>
                upd((c) => {
                  c.bahan.push({
                    id: uid(),
                    nama: "Bahan baru",
                    satuan: "g",
                    harga: 0,
                    ongkir: 0,
                    isi: 1000,
                    yield: 100,
                  });
                }),
              )}
            </div>
            <p className="text-[11px] text-slate-500 mt-3">
              Biaya per satuan = (harga beli + ongkir) ÷ (isi bersih × yield).
              Isi bersih dalam g/ml/pcs (1 kg = 1000 g, 1 liter = 1000 ml).
              Yield memperhitungkan susut, tumpah, dan kupasan.
            </p>
          </div>
        );

        const itemOpts = (self) => (
          <>
            <optgroup label="Bahan">
              {hpp.bahan.map((b) => (
                <option key={b.id} value={"b:" + b.id}>
                  {b.nama} ({b.satuan})
                </option>
              ))}
            </optgroup>
            <optgroup label="Sub-resep">
              {hpp.resep
                .filter((r) => r.batch && r.id !== self)
                .map((r) => (
                  <option key={r.id} value={"r:" + r.id}>
                    {r.nama} ({r.unit})
                  </option>
                ))}
            </optgroup>
          </>
        );
        const viewResep = (
          <div className="space-y-4">
            {hpp.resep.map((r, ri) => (
              <div key={r.id} className={card}>
                <div className="grid grid-cols-2 md:grid-cols-5 gap-2 items-end mb-3">
                  <div className="col-span-2">
                    <label className="block text-[10px] font-bold uppercase text-slate-600 mb-1">
                      Nama resep
                    </label>
                    <Txt
                      v={r.nama}
                      on={(v) =>
                        upd((c) => {
                          c.resep[ri].nama = v;
                        })
                      }
                    />
                  </div>
                  <div>
                    <label className="block text-[10px] font-bold uppercase text-slate-600 mb-1">
                      Jenis
                    </label>
                    <select
                      value={r.batch ? "1" : "0"}
                      onChange={(e) =>
                        upd((c) => {
                          c.resep[ri].batch = e.target.value === "1";
                          c.resep[ri].unit = e.target.value === "1" ? "ml" : "porsi";
                          if (e.target.value === "0") c.resep[ri].hasil = 1;
                        })
                      }
                      className={inCls}
                    >
                      <option value="0">Menu jual</option>
                      <option value="1">Sub-resep / batch</option>
                    </select>
                  </div>
                  {r.batch ? (
                    <>
                      <div>
                        <label className="block text-[10px] font-bold uppercase text-slate-600 mb-1">
                          Hasil jadi
                        </label>
                        <Num
                          v={r.hasil}
                          on={(v) =>
                            upd((c) => {
                              c.resep[ri].hasil = v;
                            })
                          }
                        />
                      </div>
                      <div>
                        <label className="block text-[10px] font-bold uppercase text-slate-600 mb-1">
                          Satuan hasil
                        </label>
                        <select
                          value={r.unit}
                          onChange={(e) =>
                            upd((c) => {
                              c.resep[ri].unit = e.target.value;
                            })
                          }
                          className={inCls}
                        >
                          {["ml", "g", "pcs"].map((u) => (
                            <option key={u}>{u}</option>
                          ))}
                        </select>
                      </div>
                    </>
                  ) : (
                    <div className="col-span-2">
                      <label className="block text-[10px] font-bold uppercase text-slate-600 mb-1">
                        Tautkan ke menu (tab Menu)
                      </label>
                      <select
                        value={r.menuId == null ? "" : String(r.menuId)}
                        onChange={(e) =>
                          upd((c) => {
                            c.resep[ri].menuId =
                              e.target.value === "" ? null : e.target.value;
                          })
                        }
                        className={inCls}
                      >
                        <option value="">(tidak ditautkan)</option>
                        {menus.map((m) => (
                          <option key={m.id} value={String(m.id)}>
                            {m.name}
                          </option>
                        ))}
                      </select>
                    </div>
                  )}
                </div>
                <div className="overflow-x-auto">
                  <table className="w-full text-xs min-w-[520px]">
                    <thead>
                      <tr>
                        {["Bahan", "Takaran", "Sat.", "Biaya", ""].map((h) => (
                          <th key={h} className={th}>
                            {h}
                          </th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {r.items.map((it, ii) => (
                        <tr key={ii} className="border-t border-slate-100">
                          <td className={td}>
                            <select
                              value={it.ref}
                              onChange={(e) =>
                                upd((c) => {
                                  c.resep[ri].items[ii].ref = e.target.value;
                                })
                              }
                              className={inCls}
                            >
                              {itemOpts(r.id)}
                            </select>
                          </td>
                          <td className={td}>
                            <Num
                              v={it.qty}
                              on={(v) =>
                                upd((c) => {
                                  c.resep[ri].items[ii].qty = v;
                                })
                              }
                            />
                          </td>
                          <td className={td}>{unitOf(it.ref)}</td>
                          <td className={td}>{rpf(nm(it.qty) * refUnit(it.ref))}</td>
                          <td className={td}>
                            {delBtn(() =>
                              upd((c) => {
                                c.resep[ri].items.splice(ii, 1);
                              }),
                            )}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
                <div className="flex flex-wrap items-center justify-between gap-2 mt-3">
                  <div className="flex gap-2">
                    {addBtn("+ Bahan ke resep", () =>
                      upd((c) => {
                        if (c.bahan[0])
                          c.resep[ri].items.push({ ref: "b:" + c.bahan[0].id, qty: 0 });
                      }),
                    )}
                    <button
                      onClick={() =>
                        ask(() =>
                          upd((c) => {
                            c.resep.splice(ri, 1);
                          }),
                        )
                      }
                      className="text-rose-600 font-bold text-xs px-3"
                    >
                      Hapus resep
                    </button>
                  </div>
                  <p className="font-extrabold text-brand-800 text-sm">
                    {r.batch
                      ? `Biaya per ${r.unit}: Rp ${fmtUnit(perPorsi(r))} (total batch ${rpf(recipeCost(r))})`
                      : `HPP bahan per porsi: ${rpf(recipeCost(r))}`}
                  </p>
                </div>
              </div>
            ))}
            {addBtn("+ Resep baru", () =>
              upd((c) => {
                c.resep.push({
                  id: uid(),
                  nama: "Resep baru",
                  batch: false,
                  hasil: 1,
                  unit: "porsi",
                  menuId: null,
                  items: [],
                });
              }),
            )}
            <p className="text-[11px] text-slate-500">
              Masukkan kemasan (cup, box, sedotan) sebagai bahan berjenis pcs.
              Sub-resep (sirup, cold brew, saus) dihitung per ml/g hasil jadi
              lalu dipakai di menu.
            </p>
          </div>
        );

        const viewOps = (
          <div className="space-y-6">
            <div className={card}>
              <h3 className="font-extrabold text-brand-800 mb-3">
                🏠 Biaya Bulanan
              </h3>
              <table className="w-full text-xs">
                <tbody>
                  {hpp.biaya.map((x, i) => (
                    <tr key={i} className="border-t border-slate-100">
                      <td className={td}>
                        <Txt
                          v={x.nama}
                          on={(v) =>
                            upd((c) => {
                              c.biaya[i].nama = v;
                            })
                          }
                        />
                      </td>
                      <td className={td}>
                        <Num
                          v={x.v}
                          on={(v) =>
                            upd((c) => {
                              c.biaya[i].v = v;
                            })
                          }
                        />
                      </td>
                      <td className={td}>
                        {delBtn(() =>
                          upd((c) => {
                            c.biaya.splice(i, 1);
                          }),
                        )}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
              <div className="mt-3">
                {addBtn("+ Tambah biaya", () =>
                  upd((c) => {
                    c.biaya.push({ nama: "Biaya baru", v: 0 });
                  }),
                )}
              </div>
            </div>
            <div className={card}>
              <h3 className="font-extrabold text-brand-800 mb-3">
                🔧 Penyusutan Alat
              </h3>
              <div className="overflow-x-auto">
                <table className="w-full text-xs min-w-[600px]">
                  <thead>
                    <tr>
                      {["Alat", "Harga beli", "Nilai sisa", "Umur (bln)", "Per bulan", ""].map(
                        (h) => (
                          <th key={h} className={th}>
                            {h}
                          </th>
                        ),
                      )}
                    </tr>
                  </thead>
                  <tbody>
                    {hpp.alat.map((a, i) => (
                      <tr key={i} className="border-t border-slate-100">
                        <td className={td}>
                          <Txt
                            v={a.nama}
                            on={(v) =>
                              upd((c) => {
                                c.alat[i].nama = v;
                              })
                            }
                          />
                        </td>
                        {["harga", "sisa", "umur"].map((f) => (
                          <td key={f} className={td}>
                            <Num
                              v={a[f]}
                              on={(v) =>
                                upd((c) => {
                                  c.alat[i][f] = v;
                                })
                              }
                            />
                          </td>
                        ))}
                        <td className={td}>{rpf(susut(a))}</td>
                        <td className={td}>
                          {delBtn(() =>
                            upd((c) => {
                              c.alat.splice(i, 1);
                            }),
                          )}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              <div className="mt-3">
                {addBtn("+ Tambah alat", () =>
                  upd((c) => {
                    c.alat.push({ nama: "Alat baru", harga: 0, sisa: 0, umur: 36 });
                  }),
                )}
              </div>
            </div>
            <div className={card}>
              <h3 className="font-extrabold text-brand-800 mb-3">
                📦 Alokasi per Porsi
              </h3>
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 items-end">
                <div>
                  <label className="block text-[10px] font-bold uppercase text-slate-600 mb-1">
                    Estimasi porsi terjual / bulan
                  </label>
                  <Num
                    v={hpp.vol}
                    on={(v) =>
                      upd((c) => {
                        c.vol = v;
                      })
                    }
                  />
                </div>
                <div>
                  <p className="text-[10px] font-bold uppercase text-slate-500">
                    Total biaya bulanan
                  </p>
                  <p className="text-lg font-extrabold text-brand-800">
                    {rpf(totalOps)}
                  </p>
                </div>
                <div>
                  <p className="text-[10px] font-bold uppercase text-slate-500">
                    Overhead per porsi
                  </p>
                  <p className="text-lg font-extrabold text-brand-800">
                    {rpf(overhead)}
                  </p>
                </div>
              </div>
              <p className="text-[11px] text-slate-500 mt-2">
                Pakai angka konservatif, misalnya rata-rata 3 bulan terakhir.
              </p>
            </div>
          </div>
        );

        const viewSim = (
          <div className="space-y-6">
            <div className={card}>
              <h3 className="font-extrabold text-brand-800 mb-1">
                🔮 Simulasi Kenaikan Harga Bahan
              </h3>
              <p className="text-xs text-slate-500 mb-3">
                Coba "bagaimana jika harga bahan naik/turun". Isi % global, atau
                override per bahan dalam % atau Rupiah (Rp = kenaikan/penurunan harga beli per kemasan, boleh minus). Kosong = ikut global. Data asli tidak berubah.
              </p>
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                <div className="sm:col-span-2 lg:col-span-3">
                  <label className="block text-[10px] font-bold uppercase text-slate-600 mb-1">
                    Perubahan harga semua bahan (%)
                  </label>
                  <Num v={sim.g} on={(v) => setSim({ ...sim, g: v })} />
                </div>
                {hpp.bahan.map((b) => {
                  const v = sim.per[b.id];
                  const has = v !== undefined && v !== "";
                  const mode = sim.mode[b.id] || "%";
                  return (
                    <div key={b.id} className="bg-slate-50 border border-slate-200 rounded-2xl p-3">
                      <label className="block text-[11px] font-bold text-slate-700 mb-1 truncate">{b.nama}</label>
                      <div className="flex gap-1.5">
                        <input
                          type="number"
                          step="any"
                          placeholder={mode === "%" ? String(nm(sim.g)) : "0"}
                          value={v ?? ""}
                          onChange={(e) => setSim({ ...sim, per: { ...sim.per, [b.id]: e.target.value } })}
                          className={inCls + " text-right"}
                        />
                        <select
                          value={mode}
                          onChange={(e) => setSim({ ...sim, mode: { ...sim.mode, [b.id]: e.target.value } })}
                          className={inCls + " !w-20 !min-w-[64px]"}
                        >
                          <option value="%">%</option>
                          <option value="Rp">Rp</option>
                        </select>
                      </div>
                      <p className="text-[10px] text-slate-500 mt-1">
                        Harga beli {rpf(nm(b.harga))} → <b>{rpf(simHarga(b))}</b>
                        {has && mode === "Rp" ? ` (${nm(v) >= 0 ? "+" : "-"}${rpf(Math.abs(nm(v)))})` : ""}
                      </p>
                    </div>
                  );
                })}
              </div>
            </div>
            <div className={card}>
              <div className="overflow-x-auto">
                <table className="w-full text-xs min-w-[760px]">
                  <thead>
                    <tr>
                      {["Menu", "HPP bahan kini", "HPP bahan simulasi", "Selisih", "Food cost baru", "Laba bersih baru", "Harga jual disarankan"].map((h) => (
                        <th key={h} className={th}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {rows.map((x) => {
                      const hs = recipeCostS(x.r) / (nm(x.r.hasil) || 1);
                      const fc = x.jual ? (hs / x.jual) * 100 : 0;
                      const net = x.jual * (1 - nm(hpp.qris) / 100) - (hs + overhead);
                      return (
                        <tr key={x.r.id} className="border-t border-slate-100">
                          <td className={td + " font-bold"}>{x.m ? x.m.name : x.r.nama}</td>
                          <td className={td}>{rpf(x.hb)}</td>
                          <td className={td}>{rpf(hs)}</td>
                          <td className={`${td} font-bold ${hs > x.hb ? "text-rose-600" : "text-emerald-600"}`}>
                            {hs >= x.hb ? "+" : "-"}{rpf(Math.abs(hs - x.hb))}
                          </td>
                          <td className={td}>
                            <span className={`px-2 py-0.5 rounded-full font-bold ${fc <= nm(hpp.fc) ? "bg-emerald-100 text-emerald-700" : "bg-rose-100 text-rose-700"}`}>
                              {fc.toFixed(1).replace(".", ",")}%
                            </span>
                          </td>
                          <td className={`${td} font-bold ${net >= 0 ? "text-emerald-600" : "text-rose-600"}`}>{rpf(net)}</td>
                          <td className={td}>{rpf(up500(hs / (nm(hpp.fc) / 100 || 1)))}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        );

        const subs = [
          ["harga", "💰 Harga & Laba"],
          ["sim", "🔮 Simulasi"],
          ["bahan", "🥛 Bahan"],
          ["resep", "📋 Resep"],
          ["ops", "🏠 Operasional"],
        ];
        return (
          <div className="space-y-6">
            <div className="bg-brand-800 rounded-3xl p-6 text-white shadow-xl">
              <h2 className="text-xl font-extrabold">🧮 Kalkulator HPP</h2>
              <p className="text-brand-100 text-sm mt-1">
                Hitung HPP presisi dari harga bahan per gram/ml/pcs, lalu
                terapkan ke menu.
              </p>
            </div>
            <div className="flex gap-2 overflow-x-auto">
              {subs.map(([k, l]) => (
                <button
                  key={k}
                  onClick={() => setSub(k)}
                  className={`px-4 py-2 rounded-full text-xs font-bold border whitespace-nowrap ${sub === k ? "bg-brand-800 text-white border-brand-800" : "bg-white text-slate-700 border-slate-200"}`}
                >
                  {l}
                </button>
              ))}
            </div>
            {sub === "harga" && viewHarga}
            {sub === "bahan" && viewBahan}
            {sub === "resep" && viewResep}
            {sub === "sim" && viewSim}
            {sub === "ops" && viewOps}
          </div>
        );
      }

      const container = document.getElementById("root");
      const root = ReactDOM.createRoot(container);
      root.render(<App />);
    </script>
  </body>
</html>
