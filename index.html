    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useMemo, useRef } = React;

      // Initial Data
      const INITIAL_PROFILE = {
        name: "Blue Brew & Snacks",
        tagline: "Gen Z Coffee & Snack Corner",
        logo: "https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=300&q=80",
      };

      const INITIAL_MENUS = [
        {
          id: 1,

          hpp: 9000,

          stock: 45,
          minStock: 10,
          image:
            "https://images.unsplash.com/photo-1541167760496-1628856ab772?auto=format&fit=crop&w=600&q=80",

        {

          stock: 30,
          minStock: 8,
          image:
            "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=format&fit=crop&w=600&q=80",
          recipe: "Double Shot Espresso, Water, Ice",
        },
        {
          id: 3,
          name: "Croissant Butter",
          category: "Snack",
          hpp: 11000,
          price: 20000,
          stock: 12,
          minStock: 5,
          image:
            "https://images.unsplash.com/photo-1555507036-ab1f4038808a?auto=format&fit=crop&w=600&q=80",
          recipe: "Butter Croissant",
        },
      ];

      const INITIAL_TRANSACTIONS = [
        {
          id: "TRX-1001",
          date: new Date(Date.now() - 3600000 * 2).toISOString(),
          items: [
            {
              id: 1,
              name: "Kopi Susu Blue Aren",
              price: 18000,
              hpp: 9000,
              qty: 2,
            },
          ],
          discountType: "percent",
          discountValue: 10,
          discountAmount: 3600,
          subtotal: 36000,
          total: 32400,
          cashPaid: 50000,
          changePaid: 17600,
          paymentMethod: "Tunai",
        },
      ];

      const INITIAL_HPP = {
        bahan: [
          { id: "kopi", nama: "Biji kopi", satuan: "g", harga: 200000, ongkir: 0, isi: 1000, yield: 95 },
          { id: "susu", nama: "Susu UHT", satuan: "ml", harga: 17000, ongkir: 0, isi: 1000, yield: 95 },
          { id: "gula", nama: "Gula aren", satuan: "g", harga: 30000, ongkir: 0, isi: 1000, yield: 100 },
          { id: "es", nama: "Es batu", satuan: "g", harga: 15000, ongkir: 0, isi: 20000, yield: 100 },
          { id: "cup", nama: "Cup + tutup + sedotan", satuan: "pcs", harga: 1200, ongkir: 0, isi: 1, yield: 100 },
          { id: "crois", nama: "Croissant (beli jadi)", satuan: "pcs", harga: 8500, ongkir: 0, isi: 1, yield: 100 },
          { id: "box", nama: "Box + plastik", satuan: "pcs", harga: 900, ongkir: 0, isi: 1, yield: 100 },
        ],
        resep: [
          { id: "r_sirup", nama: "Sirup gula aren (batch)", batch: true, hasil: 1000, unit: "ml", menuId: null, items: [{ ref: "b:gula", qty: 600 }] },
          { id: "r_1", nama: "Kopi Susu Blue Aren", batch: false, hasil: 1, unit: "porsi", menuId: "1", items: [{ ref: "b:kopi", qty: 18 }, { ref: "b:susu", qty: 120 }, { ref: "r:r_sirup", qty: 15 }, { ref: "b:es", qty: 80 }, { ref: "b:cup", qty: 1 }] },
          { id: "r_2", nama: "Iced Americano Blue", batch: false, hasil: 1, unit: "porsi", menuId: "2", items: [{ ref: "b:kopi", qty: 18 }, { ref: "b:es", qty: 100 }, { ref: "b:cup", qty: 1 }] },
          { id: "r_3", nama: "Croissant Butter", batch: false, hasil: 1, unit: "porsi", menuId: "3", items: [{ ref: "b:crois", qty: 1 }, { ref: "b:box", qty: 1 }] },
        ],
        biaya: [
          { nama: "Sewa lapak", v: 1500000 },
          { nama: "Gaji karyawan", v: 3000000 },
          { nama: "Listrik, gas, air", v: 700000 },
          { nama: "Internet & lain-lain", v: 300000 },
        ],
        alat: [
          { nama: "Mesin espresso", harga: 12000000, sisa: 2000000, umur: 36 },
          { nama: "Grinder", harga: 3000000, sisa: 500000, umur: 36 },
        ],
        vol: 3000,
        fc: 33,
        fee: 20,
        qris: 0.7,
      };
      // >>> Tempel URL Web App Apps Script (berakhiran /exec) di sini SEKALI saja,
      // supaya semua browser/perangkat otomatis terhubung ke data yang sama.
      const DEFAULT_SCRIPT_URL = "";
      const DEFAULT_API_KEY = "";
      (() => {
        const qp = new URLSearchParams(location.search);
        if (qp.get("script")) localStorage.setItem("umkm_script_url", qp.get("script"));
        if (qp.get("key")) localStorage.setItem("umkm_api_key", qp.get("key"));
      })();
      const getApiKey = () => localStorage.getItem("umkm_api_key") || DEFAULT_API_KEY;
      // Batas reset riwayat: jam 19.00 terakhir yang sudah lewat
      const RESET_HOUR = 19;
      const boundaryMs = (now) => {
        const d = new Date(now);
        const b = new Date(d.getFullYear(), d.getMonth(), d.getDate(), RESET_HOUR, 0, 0, 0);
        if (d < b) b.setDate(b.getDate() - 1);
        return b.getTime();
      };
      const newTrxId = () => {
        const n = new Date();
        const p = (x) => String(x).padStart(2, "0");
        const rnd = Math.random().toString(36).slice(2, 6).toUpperCase();
        return `TRX-${String(n.getFullYear()).slice(2)}${p(n.getMonth() + 1)}${p(n.getDate())}-${p(n.getHours())}${p(n.getMinutes())}${p(n.getSeconds())}-${rnd}`;
      };

      function App() {
        const [activeTab, setActiveTab] = useState("dashboard");

        const [profile, setProfile] = useState(() => {
          const saved = localStorage.getItem("umkm_profile");
          return saved ? JSON.parse(saved) : INITIAL_PROFILE;
        });
        const [scriptUrl, setScriptUrl] = useState(() => {
          return localStorage.getItem("umkm_script_url") || DEFAULT_SCRIPT_URL;
        });

        const [menus, setMenus] = useState(() => {
          const saved = localStorage.getItem("umkm_menus");
          return saved ? JSON.parse(saved) : INITIAL_MENUS;
        });
        const [transactions, setTransactions] = useState(() => {
          const saved = localStorage.getItem("umkm_transactions");
          return saved ? JSON.parse(saved) : INITIAL_TRANSACTIONS;
        });
        const [hpp, setHpp] = useState(() => {
          try {
            const saved = localStorage.getItem("umkm_hpp");
            return saved ? JSON.parse(saved) : INITIAL_HPP;
          } catch (e) {
            return INITIAL_HPP;
          }
        });
        const [toast, setToast] = useState(null);
        const [isSyncing, setIsSyncing] = useState(false);
        const [dark, setDark] = useState(() => document.documentElement.classList.contains("dark"));
        useEffect(() => {
          document.documentElement.classList.toggle("dark", dark);
          localStorage.setItem("umkm_theme", dark ? "dark" : "light");
        }, [dark]);

        // ---- sinkronisasi multi-tab / multi-device ----
        const R = useRef({});
        R.current = { ...R.current, profile, menus, hpp, transactions, scriptUrl };
        const readJson = (k, d) => {
          try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; }
        };
        const tsRef = useRef(readJson("umkm_ts", {}));
        const serverTsRef = useRef(readJson("umkm_server_ts", {}));
        const syncedRef = useRef(new Set(readJson("umkm_synced", [])));
        const remoteRef = useRef({});
        const mountedRef = useRef({});
        const syncingRef = useRef(false);
        const verRef = useRef(null);
        const warnedRef = useRef(false);
        const lastResetRef = useRef(
          (() => {
            const v = Number(localStorage.getItem("umkm_last_reset"));
            if (v) return v;
            const b = boundaryMs(new Date());
            localStorage.setItem("umkm_last_reset", String(b));
            return b;
          })(),
        );
        const SETTERS = { profile: setProfile, menus: setMenus, hpp: setHpp };
        const persistMeta = () => {
          localStorage.setItem("umkm_ts", JSON.stringify(tsRef.current));
          localStorage.setItem("umkm_server_ts", JSON.stringify(serverTsRef.current));
        };
        const saveSynced = () => localStorage.setItem("umkm_synced", JSON.stringify([...syncedRef.current]));
        const applyRemote = (k, value) => {
          if (JSON.stringify(R.current[k]) === JSON.stringify(value)) return;
          remoteRef.current[k] = true;
          SETTERS[k](value);
        };
        const touch = (k) => {
          if (!mountedRef.current[k]) { mountedRef.current[k] = true; return; }
          if (remoteRef.current[k]) { remoteRef.current[k] = false; return; }
          tsRef.current = { ...tsRef.current, [k]: Date.now() };
          persistMeta();
        };

        useEffect(() => {
          localStorage.setItem("umkm_profile", JSON.stringify(profile));
          touch("profile");
        }, [profile]);

        useEffect(() => {
          localStorage.setItem("umkm_script_url", scriptUrl);
        }, [scriptUrl]);

        useEffect(() => {
          localStorage.setItem("umkm_menus", JSON.stringify(menus));
          touch("menus");
        }, [menus]);

        useEffect(() => {
          localStorage.setItem(
            "umkm_transactions",
            JSON.stringify(transactions),
          );
        }, [transactions]);

        useEffect(() => {
          localStorage.setItem("umkm_hpp", JSON.stringify(hpp));
          touch("hpp");
        }, [hpp]);

        const callApi = async (body) => {
          const url = (R.current.scriptUrl || "").trim();
          if (!/^https:\/\/script\.google\.com\/(macros|a\/macros\/[^/]+)\/s\/[^/]+\/exec\/?$/.test(url))
            throw new Error("URL Web App tidak valid. Harus seperti https://script.google.com/macros/s/.../exec (berakhiran /exec, bukan /dev atau alamat editor).");
          const ctrl = new AbortController();
          const timer = setTimeout(() => ctrl.abort(), 30000);
          let text;
          try {
            const res = await fetch(url, {
              method: "POST",
              headers: { "Content-Type": "text/plain;charset=utf-8" },
              body: JSON.stringify({ ...body, apiKey: getApiKey() }),
              signal: ctrl.signal,
            });
            text = await res.text();
          } catch (e) {
            if (e.name === "AbortError") throw new Error("Apps Script tidak merespons (lebih dari 30 detik).");
            throw new Error("Tidak bisa menjangkau Apps Script. Periksa: URL /exec benar, deployment diatur akses 'Anyone', koneksi internet, dan matikan adblock/VPN.");
          } finally {
            clearTimeout(timer);
          }
          let json;
          try {
            json = JSON.parse(text);
          } catch (e) {
            if (/<html|<!doctype/i.test(text))
              throw new Error("Server mengembalikan halaman HTML, bukan data. Biasanya: (a) akses deployment belum 'Anyone', (b) izin belum diberikan (jalankan setup() lalu Authorize), atau (c) error di script: cek menu Executions di Apps Script.");
            throw new Error("Respon server bukan JSON: " + text.slice(0, 80));
          }
          if (!json.ok) {
            if (/Aksi tidak dikenal/.test(json.error || ""))
              throw new Error("Code.gs di server masih versi lama. Tempel Code.gs terbaru lalu Deploy > New deployment.");
            throw new Error(json.error || "Respon tidak valid");
          }
          return json;
        };

        const showToast = (message, type = "success") => {
          setToast({ message, type });
          setTimeout(() => setToast(null), type === "error" ? 10000 : 3500);
        };

        const SAMPLE_ID = "TRX-1001";
        const hasLocalChanges = () => {
          const cur = R.current;
          if (cur.transactions.some((t) => t.id !== SAMPLE_ID && !syncedRef.current.has(t.id))) return true;
          return ["profile", "menus", "hpp"].some(
            (k) => serverTsRef.current[k] === undefined || (tsRef.current[k] || 0) > (serverTsRef.current[k] || 0),
          );
        };

        const syncNow = async (opts = {}) => {
          if (!R.current.scriptUrl) {
            if (opts.manual) showToast("Harap atur URL Web App Google Sheets di tab Profil terlebih dahulu!", "error");
            return false;
          }
          if (syncingRef.current) {
            if (opts.manual) showToast("Sinkronisasi sedang berjalan, coba lagi sebentar.", "error");
            return false;
          }
          syncingRef.current = true;
          if (opts.manual) setIsSyncing(true);
          try {
            const cur = R.current;
            const since = boundaryMs(new Date());
            const pending = cur.transactions.filter((t) => t.id !== SAMPLE_ID && !syncedRef.current.has(t.id));
            const sections = {};
            ["profile", "menus", "hpp"].forEach((k) => {
              const known = serverTsRef.current[k] !== undefined && !opts.force;
              const ts = known ? tsRef.current[k] || 0 : 0;
              sections[k] = { ts };
              if (known && ts > (serverTsRef.current[k] || 0)) sections[k].data = cur[k];
            });
            const json = await callApi({ action: "sync", since, tx: pending, sections });
            (json.accepted || []).forEach((id) => syncedRef.current.add(id));
            let seeded = false;
            Object.keys(json.sections || {}).forEach((k) => {
              const sec = json.sections[k];
              serverTsRef.current = { ...serverTsRef.current, [k]: sec.ts };
              if (sec.data !== undefined && sec.data !== null) {
                applyRemote(k, sec.data);
                tsRef.current = { ...tsRef.current, [k]: sec.ts };
              } else if (!sec.ts && !tsRef.current[k]) {
                tsRef.current = { ...tsRef.current, [k]: Date.now() };
                seeded = true;
              }
            });
            persistMeta();
            const remote = json.transactions || [];
            remote.forEach((t) => syncedRef.current.add(t.id));
            saveSynced();
            const have = new Set(R.current.transactions.map((t) => t.id));
            const fresh = remote.filter((t) => !have.has(t.id));
            if (fresh.length)
              setTransactions((prev) => {
                const ids = new Set(prev.map((t) => t.id));
                return [...fresh.filter((t) => !ids.has(t.id)), ...prev].sort((x, y) => new Date(y.date) - new Date(x.date));
              });
            verRef.current = json.ver;
            if (opts.manual)
              showToast(
                `Sinkron selesai: ${json.added || 0} transaksi baru` +
                  (json.skipped ? `, ${json.skipped} duplikat dilewati (tidak ditulis ulang)` : ""),
              );
            if (seeded && !opts.again) {
              syncingRef.current = false;
              return await syncNow({ ...opts, manual: false, again: true });
            }
            return true;
          } catch (err) {
            if (opts.manual) showToast("Gagal sinkronisasi: " + err.message, "error");
            return false;
          } finally {
            syncingRef.current = false;
            if (opts.manual) setIsSyncing(false);
          }
        };

        // Reset riwayat transaksi setiap jam 19.00 (arsip tetap di Google Sheets)
        const checkReset = async () => {
          const boundary = boundaryMs(new Date());
          if (lastResetRef.current >= boundary) return;
          const old = R.current.transactions.filter((t) => new Date(t.date).getTime() < boundary);
          if (old.length) {
            if (!R.current.scriptUrl) {
              if (!warnedRef.current) {
                warnedRef.current = true;
                showToast("Reset jam 19.00 ditunda: atur URL Google Sheets dulu agar riwayat lama tidak hilang.", "error");
              }
              return;
            }
            const ok = await syncNow({ silent: true });
            if (!ok || old.some((t) => t.id !== SAMPLE_ID && !syncedRef.current.has(t.id))) return;
            setTransactions((ts) => ts.filter((t) => new Date(t.date).getTime() >= boundary));
            showToast("Riwayat transaksi direset (jam 19.00). Arsip lengkap ada di Google Sheets.");
          }
          lastResetRef.current = boundary;
          localStorage.setItem("umkm_last_reset", String(boundary));
        };

        const testConnection = async () => {
          if (!R.current.scriptUrl) { showToast("Isi dan simpan URL Web App dulu di kolom di atas.", "error"); return; }
          setIsSyncing(true);
          try {
            await callApi({ action: "ping" });
            await callApi({ action: "ver" });
            showToast("Koneksi OK: URL, API key, dan versi Code.gs sesuai ✔");
          } catch (err) {
            showToast("Tes gagal: " + err.message, "error");
          } finally {
            setIsSyncing(false);
          }
        };
        const syncToSpreadsheet = () => syncNow({ manual: true });
        const loadFromSpreadsheet = async () => {
          if (!confirm("Profil, menu, dan data HPP di perangkat ini akan diganti dengan versi di Google Sheets. Lanjutkan?")) return;
          await syncNow({ manual: true, force: true });
        };
        Object.assign(R.current, { callApi, syncNow, checkReset, hasLocalChanges });

        // polling ringan tiap 20 dtk: cek versi dulu, tarik data penuh hanya bila ada perubahan
        useEffect(() => {
          const tick = async () => {
            const r = R.current;
            if (document.hidden) {
              if (r.scriptUrl && r.hasLocalChanges()) await r.syncNow({ silent: true });
              return;
            }
            if (r.scriptUrl) {
              if (r.hasLocalChanges()) await r.syncNow({ silent: true });
              else {
                try {
                  const j = await r.callApi({ action: "ver" });
                  if (j.ver !== verRef.current) await r.syncNow({ silent: true });
                } catch (e) {}
              }
            }
            await r.checkReset();
          };
          tick();
          const iv = setInterval(tick, 20000);
          const onVis = () => { if (!document.hidden) tick(); };
          document.addEventListener("visibilitychange", onVis);
          window.addEventListener("focus", onVis);
          return () => {
            clearInterval(iv);
            document.removeEventListener("visibilitychange", onVis);
            window.removeEventListener("focus", onVis);
          };
        }, []);

        // kirim perubahan lokal segera (debounce 2 dtk)
        useEffect(() => {
          const t = setTimeout(() => {
            const r = R.current;
            if (r.scriptUrl && r.hasLocalChanges()) r.syncNow({ silent: true });
          }, 2000);
          return () => clearTimeout(t);
        }, [transactions, menus, profile, hpp, scriptUrl]);

        // tab lain di browser yang sama
        useEffect(() => {
          const onStorage = (e) => {
            if (!e.key || !e.key.startsWith("umkm_") || e.newValue == null) return;
            try {
              if (e.key === "umkm_script_url") return setScriptUrl(e.newValue);
              if (e.key === "umkm_last_reset") { lastResetRef.current = Number(e.newValue) || 0; return; }
              const v = JSON.parse(e.newValue);
              if (e.key === "umkm_menus") applyRemote("menus", v);
              else if (e.key === "umkm_profile") applyRemote("profile", v);
              else if (e.key === "umkm_hpp") applyRemote("hpp", v);
              else if (e.key === "umkm_transactions") setTransactions(v);
              else if (e.key === "umkm_ts") tsRef.current = v;
              else if (e.key === "umkm_server_ts") serverTsRef.current = v;
              else if (e.key === "umkm_synced") syncedRef.current = new Set(v);
            } catch (err) {}
          };
          window.addEventListener("storage", onStorage);

        }, []);

          (acc, t) => acc + t.items.reduce((sum, item) => sum + item.qty, 0),
          0,

          recipe: "",

          const matchesCategory =

          const matchesSearch = m.name
            .toLowerCase()
            .includes(searchQuery.toLowerCase());
          return matchesCategory && matchesSearch;
        });

        const handleFileUpload = (e) => {
          const file = e.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onloadend = () => {
              setFormData({ ...formData, image: reader.result });
            };
            reader.readAsDataURL(file);
          }
        };

            category: "Kopi",
            hpp: "",
            price: "",

            image:

          setIsModalOpen(true);

          setEditingMenu(menu);
          setFormData({
            name: menu.name,
            category: menu.category,
            hpp: menu.hpp || 0,
            price: menu.price,
            stock: menu.stock,
            minStock: menu.minStock || 5,
            image: menu.image,
            recipe: menu.recipe || "",
          });

        };

          e.preventDefault();

      // ==================== KASIR (POS) TAB WITH DISCOUNT & CASH CHANGE ====================
      function PosTab({
        menus,
        setMenus,
        transactions,
        setTransactions,
        showToast,
      }) {
        const [cart, setCart] = useState([]);
        const [paymentMethod, setPaymentMethod] = useState("Tunai");
        const [discountType, setDiscountType] = useState("percent"); // 'percent' or 'nominal'
        const [discountValue, setDiscountValue] = useState(0);
        const [cashPaid, setCashPaid] = useState("");
        const [searchTerm, setSearchTerm] = useState("");

        const filteredMenus = menus.filter((m) =>
          m.name.toLowerCase().includes(searchTerm.toLowerCase()),
        );

        const addToCart = (menu) => {
          if (menu.stock <= 0) {
            showToast(`Stok "${menu.name}" habis!`, "error");
            return;
          }

          const existing = cart.find((item) => item.id === menu.id);
          if (existing) {
            if (existing.qty >= menu.stock) {
              showToast(`Stok "${menu.name}" tidak mencukupi!`, "error");
              return;
            }
            setCart(
              cart.map((item) =>
                item.id === menu.id ? { ...item, qty: item.qty + 1 } : item,
              ),
            );
          } else {
            setCart([
              ...cart,
              {
                id: menu.id,
                name: menu.name,
                price: menu.price,
                hpp: menu.hpp || 0,
                qty: 1,
              },
            ]);
          }
        };

        const updateCartQty = (id, delta) => {
          const menuObj = menus.find((m) => m.id === id);
          setCart(
            cart
              .map((item) => {
                if (item.id === id) {
                  const newQty = item.qty + delta;
                  if (newQty > menuObj.stock) {
                    showToast(
                      `Stok maksimal tersisa ${menuObj.stock}`,
                      "error",
                    );
                    return item;
                  }
                  return newQty > 0 ? { ...item, qty: newQty } : null;
                }
                return item;
              })
              .filter(Boolean),
          );
        };

        const subtotal = cart.reduce(
          (sum, item) => sum + item.price * item.qty,
          0,
        );

        // Calculate Discount Amount
        const discountAmount = useMemo(() => {
          if (discountType === "percent") {
            return Math.round(subtotal * (Number(discountValue) / 100));
          } else {
            return Math.min(subtotal, Number(discountValue) || 0);
          }
        }, [subtotal, discountType, discountValue]);

        const cartTotal = Math.max(0, subtotal - discountAmount);
        const numericCashPaid = Number(cashPaid) || 0;
        const changePaid =
          paymentMethod === "Tunai"
            ? Math.max(0, numericCashPaid - cartTotal)
            : 0;

        const handleCheckout = () => {
          if (cart.length === 0) {
            showToast("Keranjang masih kosong!", "error");
            return;
          }

          if (paymentMethod === "Tunai" && numericCashPaid < cartTotal) {
            showToast("Uang tunai yang dibayar kurang!", "error");
            return;
          }

          setMenus((ms) =>
            ms.map((menu) => {
              const cartItem = cart.find((ci) => ci.id === menu.id);
              if (cartItem) {
                return { ...menu, stock: Math.max(0, menu.stock - cartItem.qty) };
              }
              return menu;
            }),
          );

          const newTrx = {
            id: newTrxId(),
            date: new Date().toISOString(),
            items: [...cart],
            discountType: discountType,
            discountValue: Number(discountValue),
            discountAmount: discountAmount,
            subtotal: subtotal,
            total: cartTotal,
            cashPaid: paymentMethod === "Tunai" ? numericCashPaid : cartTotal,
            changePaid: changePaid,
            paymentMethod: paymentMethod,
          };

          setTransactions((ts) => [newTrx, ...ts]);
          setCart([]);
          setDiscountValue(0);
          setCashPaid("");
          showToast(
            `Transaksi ${newTrx.id} Berhasil! ${paymentMethod === "Tunai" ? `Kembalian: Rp ${changePaid.toLocaleString("id-ID")}` : ""}`,
          );
        };

        return (
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div className="lg:col-span-7 space-y-6">
              <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm flex items-center justify-between">
                <h2 className="text-xl font-extrabold text-brand-800">
                  Kasir (POS) ☕
                </h2>
                <input
                  type="text"
                  placeholder="Cari menu..."
                  value={searchTerm}
                  onChange={(e) => setSearchTerm(e.target.value)}
                  className="bg-slate-50 border border-slate-200 rounded-2xl px-4 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-brand-800"
                />
              </div>

              <div className="grid grid-cols-2 sm:grid-cols-3 gap-4">
                {filteredMenus.map((menu) => (
                  <button
                    key={menu.id}
                    onClick={() => addToCart(menu)}
                    disabled={menu.stock <= 0}
                    className={`bg-white rounded-2xl border p-3 text-left transition-all ${
                      menu.stock <= 0
                        ? "opacity-40 border-rose-200"
                        : "border-slate-200 hover:border-brand-800"
                    }`}
                  >
                    <div className="h-28 rounded-xl overflow-hidden mb-2 bg-slate-100">
                      <img
                        src={menu.image}
                        className="w-full h-full object-cover"
                      />
                    </div>
                    <h4 className="font-extrabold text-slate-900 text-xs line-clamp-1">
                      {menu.name}
                    </h4>
                    <p className="font-black text-brand-800 text-xs mt-1">
                      Rp {menu.price.toLocaleString("id-ID")}
                    </p>
                    <span className="text-[10px] text-slate-500 font-bold block mt-2">
                      Stok: {menu.stock}
                    </span>
                  </button>
                ))}
              </div>
            </div>

            {/* Cart & Checkout */}
            <div className="lg:col-span-5 bg-white p-6 rounded-3xl border border-slate-200 shadow-sm flex flex-col justify-between h-fit sticky top-28">
              <div>
                <h3 className="text-lg font-bold text-slate-900 pb-4 border-b border-slate-100">
                  🛒 Keranjang Pesanan
                </h3>

                <div className="divide-y divide-slate-100 max-h-52 overflow-y-auto my-4">
                  {cart.length === 0 ? (
                    <p className="text-center py-8 text-slate-400 text-xs">
                      Keranjang masih kosong.
                    </p>
                  ) : (
                    cart.map((item) => (
                      <div
                        key={item.id}
                        className="py-3 flex items-center justify-between"
                      >
                        <div>
                          <h4 className="font-bold text-slate-900 text-xs">
                            {item.name}
                          </h4>
                          <p className="text-xs text-brand-800 font-semibold">
                            Rp {item.price.toLocaleString("id-ID")}
                          </p>
                        </div>
                        <div className="flex items-center gap-2">
                          <button
                            onClick={() => updateCartQty(item.id, -1)}
                            className="w-6 h-6 rounded bg-slate-100 font-bold text-xs text-brand-800"
                          >
                            -
                          </button>
                          <span className="font-bold text-xs">{item.qty}</span>
                          <button
                            onClick={() => updateCartQty(item.id, 1)}
                            className="w-6 h-6 rounded bg-slate-100 font-bold text-xs text-brand-800"
                          >
                            +
                          </button>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>

              <div className="border-t border-slate-100 pt-4 space-y-4">
                {/* Fitur Diskon % & Nominal */}
                <div>
                  <div className="flex items-center justify-between mb-1">
                    <label className="block text-xs font-bold text-slate-700 uppercase">
                      Diskon
                    </label>
                    <div className="flex items-center gap-1 bg-slate-100 p-1 rounded-xl">
                      <button
                        onClick={() => setDiscountType("percent")}
                        className={`px-2 py-0.5 rounded-lg text-[10px] font-bold ${discountType === "percent" ? "bg-brand-800 text-white" : "text-slate-600"}`}
                      >
                        Persen (%)
                      </button>
                      <button
                        onClick={() => setDiscountType("nominal")}
                        className={`px-2 py-0.5 rounded-lg text-[10px] font-bold ${discountType === "nominal" ? "bg-brand-800 text-white" : "text-slate-600"}`}
                      >
                        Nominal (Rp)
                      </button>
                    </div>
                  </div>
                  <input
                    type="number"
                    min="0"
                    placeholder={
                      discountType === "percent"
                        ? "Contoh: 10 (%)"
                        : "Contoh: 5000 (Rp)"
                    }
                    value={discountValue || ""}
                    onChange={(e) => setDiscountValue(e.target.value)}
                    className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-brand-800"
                  />
                </div>

                {/* Metode Pembayaran */}
                <div>
                  <label className="block text-xs font-bold text-slate-700 uppercase mb-1">
                    Metode Pembayaran
                  </label>
                  <div className="grid grid-cols-3 gap-2">
                    {["Tunai", "QRIS", "Transfer"].map((method) => (
                      <button
                        key={method}
                        onClick={() => setPaymentMethod(method)}
                        className={`py-2 rounded-xl text-xs font-bold border ${
                          paymentMethod === method
                            ? "bg-brand-800 text-white border-brand-800"
                            : "bg-slate-50 text-slate-700 border-slate-200"
                        }`}
                      >
                        {method}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Input Tunai & Fitur Kembalian */}
                {paymentMethod === "Tunai" && (
                  <div className="bg-blue-50/50 p-3 rounded-2xl border border-blue-100 space-y-2">
                    <div>
                      <label className="block text-[10px] font-bold text-brand-800 uppercase mb-1">
                        Uang Tunai Diterima (Rp)
                      </label>
                      <input
                        type="number"
                        placeholder="Contoh: 50000"
                        value={cashPaid}
                        onChange={(e) => setCashPaid(e.target.value)}
                        className="w-full bg-white border border-slate-200 rounded-xl px-3 py-1.5 text-xs font-bold text-brand-800 focus:outline-none focus:ring-2 focus:ring-brand-800"
                      />
                    </div>
                    <div className="space-y-1.5">
                      <div className="flex flex-wrap gap-1.5">
                        <button
                          type="button"
                          onClick={() => setCashPaid(String(cartTotal))}
                          disabled={cartTotal <= 0}
                          className="px-3 py-1.5 rounded-xl text-[11px] font-extrabold bg-emerald-600 text-white disabled:opacity-40"
                        >
                          Uang Pas
                        </button>
                        {[2000, 5000, 10000, 20000, 50000, 100000].map((n) => (
                          <button
                            key={n}
                            type="button"
                            onClick={() => setCashPaid(String(numericCashPaid + n))}
                            className="px-3 py-1.5 rounded-xl text-[11px] font-bold bg-white border border-brand-200 text-brand-800 hover:bg-brand-100"
                          >
                            {n.toLocaleString("id-ID")}
                          </button>
                        ))}
                        <button
                          type="button"
                          onClick={() => setCashPaid("")}
                          className="px-3 py-1.5 rounded-xl text-[11px] font-bold bg-rose-50 text-rose-600 border border-rose-200"
                        >
                          Reset
                        </button>
                      </div>
                      <p className="text-[10px] text-slate-500">
                        Tekan nominal untuk menambah (mis. 100.000 + 50.000 = 150.000).
                      </p>
                    </div>
                    <div className="flex justify-between items-center text-xs">
                      <span className="font-bold text-slate-600">
                        Kembalian:
                      </span>
                      <span
                        className={`font-extrabold ${numericCashPaid < cartTotal ? "text-rose-600" : "text-emerald-600"}`}
                      >
                        Rp {changePaid.toLocaleString("id-ID")}
                      </span>
                    </div>
                  </div>
                )}

                {/* Subtotal & Total Display */}
                <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-1">
                  <div className="flex justify-between text-xs text-slate-500 font-medium">
                    <span>Subtotal:</span>
                    <span>Rp {subtotal.toLocaleString("id-ID")}</span>
                  </div>
                  {discountAmount > 0 && (
                    <div className="flex justify-between text-xs text-rose-600 font-semibold">
                      <span>Diskon Potongan:</span>
                      <span>- Rp {discountAmount.toLocaleString("id-ID")}</span>
                    </div>
                  )}
                  <div className="flex justify-between text-base font-black text-brand-800 pt-1 border-t border-slate-200">
                    <span>Total Tagihan:</span>
                    <span>Rp {cartTotal.toLocaleString("id-ID")}</span>
                  </div>
                </div>

                <button
                  onClick={handleCheckout}
                  disabled={cart.length === 0}
                  className="w-full py-4 rounded-2xl font-extrabold text-sm bg-brand-800 text-white shadow-xl hover:bg-brand-900 transition-all disabled:opacity-50"
                >
                  ⚡ Bayar & Potong Stok
                </button>
              </div>
            </div>
          </div>
        );
